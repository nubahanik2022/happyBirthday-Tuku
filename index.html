<html lang="bn">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--c);color:var(--w);font-family:'Hind Siliguri','Noto Sans Bengali',sans-serif;overflow:hidden}
#stage{position:absolute;inset:0}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,transparent 58%,rgba(20,12,6,.2))}
.sc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.sv{width:min(100vw,177.78vh);aspect-ratio:16/9;display:block;overflow:hidden}
#s6{background:#F8F8F5}
#sub{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;width:min(860px,92vw);text-align:center;font-size:clamp(16px,2.5vw,27px);line-height:1.6;padding:.35em .8em;border-radius:10px;background:rgba(20,20,20,.55);color:var(--w);opacity:0;pointer-events:none;z-index:5}
#bar{position:fixed;top:0;left:0;height:3px;background:var(--o);width:0;z-index:20}
#ctl{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;z-index:20;background:rgba(20,20,20,.55);padding:6px 10px;border-radius:30px;backdrop-filter:blur(6px)}
#ctl button{background:none;border:1px solid rgba(248,248,245,.35);color:var(--w);border-radius:50%;width:36px;height:36px;font-size:15px;cursor:pointer}
#ctl button:hover,#ctl button:focus-visible{border-color:var(--o);outline:none}
#dots{display:flex;gap:6px;margin:0 6px}
#dots i{width:8px;height:8px;border-radius:50%;background:rgba(248,248,245,.3);cursor:pointer}
#dots i.on{background:var(--o)}
#intro{position:fixed;inset:0;z-index:50;background:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:18px}
#intro h1{font-weight:500;font-size:clamp(34px,7vw,68px);color:var(--w)}
#intro p{color:var(--g);font-size:clamp(16px,2.6vw,24px)}
#intro button{margin-top:14px;background:none;border:1.5px solid var(--o);color:var(--w);padding:12px 30px;border-radius:40px;font-weight:500;font-size:clamp(16px,2.4vw,21px);font-family:inherit;cursor:pointer;transition:.3s}
#intro button:hover{background:var(--o)}
.ct{position:absolute;top:4%;left:5%;font-size:clamp(14px,2.4vw,24px);color:#252525;background:rgba(248,248,245,.7);padding:.2em .7em;border-radius:20px}
.bd{position:absolute;top:7%;left:0;right:0;text-align:center;color:#F8F8F5;opacity:0;text-shadow:0 2px 12px #000;z-index:4}
.bd b{display:block;font-weight:500;font-size:clamp(22px,4.6vw,46px)}
.bd span{font-size:clamp(15px,2.4vw,24px)}
.tag{position:absolute;top:3%;right:4%;font-size:clamp(11px,1.5vw,14px);color:#fff;opacity:.7;z-index:4}
#lt{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(620px,90vw);max-height:66vh;overflow:auto;background:#fffdf8;color:#252525;border:1px solid var(--g);box-shadow:0 20px 60px rgba(0,0,0,.12);border-radius:6px;padding:clamp(18px,4vw,40px);font-size:clamp(15px,2vw,19px);line-height:1.95}
#lt p{margin-bottom:1em}
#lt .w{opacity:0}
#fin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:#252525;opacity:0;pointer-events:none;padding:20px}
#fin h2{font-weight:500;letter-spacing:.3em;font-size:clamp(26px,6vw,56px)}
#fin p{font-size:clamp(15px,2.4vw,22px);color:#555}
@media(max-width:720px){#s6 .side{opacity:.25}}
</style>
</head>

const LET=['নুবাহ্,','তোমাকে নিয়ে একসময় অনেক সুন্দর স্বপ্ন দেখেছিলাম।','তোমাকে বড় হতে দেখা, নিজের স্বপ্ন পূরণ করতে দেখা, তোমার প্রতিটি ছোট্ট সাফল্যে খুশি হওয়া—এমন অনেক মুহূর্ত কল্পনায় সাজিয়েছিলাম।','তোমার সঙ্গে কাটানো সময়, তোমার পরিচিত ঘ্রাণ, তোমার হাসি আর আমাদের ছোট ছোট কথাগুলো আমার স্মৃতিতে থেকে যাবে।','একসময় তোমার প্রতিদিনের খোঁজ নেওয়াটা আমার অভ্যাস ছিল।','খেয়েছো কি না, শরীর ভালো আছে কি না, বাসায় পৌঁছেছো কি না—এই সাধারণ প্রশ্নগুলোর মধ্যেও আমার অনেক যত্ন লুকিয়ে থাকত।','আমি চেয়েছিলাম তোমার জীবনের কঠিন সময়গুলো একটু সহজ করতে। তোমার স্বপ্নের পথে পাশে থাকতে।','জীবন সবসময় আমাদের কল্পনার মতো হয় না। তবুও তোমার প্রতি আমার শুভকামনাগুলো সত্যি।','তোমার আগামী দিনগুলো সুন্দর হোক। তুমি নিজের স্বপ্ন পূরণ করো, নিজের মতো করে এগিয়ে যাও।','কখনো যদি স্বাভাবিকভাবে কথা বলার ইচ্ছে হয়, আমার সঙ্গে যোগাযোগ করতে পারো। আর যদি না হয়, তোমার সিদ্ধান্তকেও সম্মান করব।','তোমার জন্য আমার দরজা খোলা থাকার কথাটা কোনো প্রত্যাশা নয়, শুধু একটা আন্তরিক অনুভূতি।','আমি তোমাকে ভালোবেসেছিলাম, নুবাহ্। সেই অনুভূতির সুন্দর অংশগুলো আমি সম্মানের সঙ্গেই মনে রাখতে চাই।','আজকের দিনটা তোমার জন্য অনেক সুন্দর হোক।','Happy Birthday, Nubah.','— Anik Biswas'];

$('#bpl').onclick=()=>{auto=!auto;$('#bpl').textContent=auto?'❚❚':'▶';auto?(tl&&tl.play()):(tl&&tl.pause());clearTimeout(tm);if(auto&&tl&&tl.progress()===1)goTo(cur+1)};
addEventListener('keydown',e=>{if(e.key==='ArrowRight')goTo(cur+1);if(e.key==='ArrowLeft')goTo(cur-1)});
let wl=0;addEventListener('wheel',e=>{if(e.target.closest('#lt')||cur<0||Date.now()-wl<1100||Math.abs(e.deltaY)<30)return;wl=Date.now();goTo(cur+(e.deltaY>0?1:-1))},{passive:true});
let ty=0;addEventListener('touchstart',e=>ty=e.touches[0].clientY,{passive:true});
addEventListener('touchend',e=>{if(e.target.closest('#lt')||e.target.closest('#ctl')||cur<0)return;const d=ty-e.changedTouches[0].clientY;if(Math.abs(d)>60)goTo(cur+(d>0?1:-1))});
let ac,on=false,mi;const NT=[261.6,329.6,392,440,523.3,392,329.6,293.7];
const note=f=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+2.4);o.connect(g).connect(ac.destination);o.start();o.stop(t+2.5)};
$('#bm').onclick=()=>{if(on){on=false;clearInterval(mi);$('#bm').style.opacity=.5;return}on=true;ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();$('#bm').style.opacity=1;let k=0;mi=setInterval(()=>note(NT[k++%8]*(Math.random()<.2?.5:1)),950)};
$('#bm').style.opacity=.5;
</script>
